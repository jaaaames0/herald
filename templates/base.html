<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}herald{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%2334d399'>⬢</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/herald.css') }}">
</head>
<body>

  <nav class="sidebar">
    <div class="sidebar-top">
      <a href="{{ url_for('index') }}" class="brand">herald</a>
      <span class="brand-sub">the digest</span>
    </div>

    <div class="nav-section">
      <span class="nav-label">navigation</span>
      <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}nav-link-active{% endif %}">
        <span class="nav-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 0-2-2H4a2 2 0 0 1-2-2v-2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6z"/></svg>
        </span>
        latest
      </a>
      <a href="{{ url_for('debug') }}" class="nav-link {% if request.endpoint == 'debug' %}nav-link-active{% endif %}">
        <span class="nav-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </span>
        debug
      </a>
    </div>

    <div class="sidebar-bottom">
      <span class="brand-sub">optiplex &middot; {{ now_year }}</span>
    </div>
  </nav>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
