<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{% block title %}herald{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%2334d399'>⬢</text></svg>">
<style>
:root { --bg:#0d1117; --surface:#161b22; --surface2:#1c2128; --border:#2a313a; --border-strong:#3d4652; --text:#e6edf3; --muted:#8b949e; --accent:#34d399; --accent-dim:rgba(52,211,153,.1); }
* { box-sizing:border-box; }
html { background:var(--bg); color:var(--text); color-scheme:dark; -webkit-text-size-adjust:100%; }
body { margin:0; font:17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
.wrap { max-width:640px; margin:0 auto; padding:16px 16px 64px; }
nav.top { display:flex; justify-content:space-between; align-items:baseline; font:13px ui-monospace, monospace; color:var(--muted); padding:4px 0 18px; }
nav.top .brand { color:var(--accent); font-weight:600; }
nav.top a { color:var(--muted); margin-left:14px; }
header.digest h1 { font-size:26px; line-height:1.2; margin:0 0 4px; }
header.digest .meta { color:var(--muted); font-size:14px; }
.mood { font-size:18px; margin:18px 0 26px; padding-left:14px; border-left:3px solid var(--accent); }
.mood p { margin:0; }
section.entry { margin:0; padding:22px 0 24px; border-top:1px solid var(--border); }
section.entry:first-of-type { border-top:2px solid var(--accent); }
section.story { border-top:2px solid var(--border-strong); }
.kicker { font:600 12px ui-monospace, monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin:0 0 6px; }
section.story h2 { font-size:21px; line-height:1.25; margin:2px 0 8px; }
section.story .body p { margin:0 0 12px; }
a.cite { font-size:13px; color:var(--muted); background:var(--surface2); border-radius:4px; padding:0 4px; margin:0 1px; white-space:nowrap; }
a.cite:hover { color:var(--accent); text-decoration:none; }
a.cite.named { font-size:inherit; color:var(--accent); background:none; padding:0; margin:0; }
.kicker a { color:inherit; }
.setup { color:var(--muted); font-size:15px; margin:0 0 6px; }
details.sources > summary { cursor:pointer; color:var(--muted); font-size:14px; margin:6px 0; list-style:none; }
details.sources > summary::before { content:"▸ "; }
details.sources[open] > summary::before { content:"▾ "; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin:8px 0; }
.card.compact { font-size:15px; }
.card.target { outline:2px solid var(--accent); }
.card .who { font-size:14px; color:var(--muted); display:flex; flex-wrap:wrap; gap:0 6px; align-items:baseline; }
.card .who b { color:var(--text); font-weight:600; }
.card .who .time { margin-left:auto; }
.card .text { white-space:pre-wrap; overflow-wrap:anywhere; margin:4px 0 0; }
.card .text details { display:inline; }
.card .text details summary { display:inline; color:var(--accent); cursor:pointer; font-size:14px; }
.card .stats { font-size:13px; color:var(--muted); margin-top:8px; }
.parent { border-left:2px solid var(--border); margin:0 0 8px 2px; padding:0 0 0 10px; color:var(--muted); font-size:15px; }
.parent .who { font-size:13px; }
.thread { border-top:1px dashed var(--border); margin-top:8px; padding-top:8px; }
.quote { border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin:10px 0 0; background:var(--surface2); font-size:15px; }
.media { display:grid; gap:4px; margin-top:10px; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); }
.media figure { margin:0; }
.media img { width:100%; height:auto; max-height:520px; object-fit:contain; border-radius:8px; background:#000; display:block; }
.media .video { position:relative; display:block; }
.media .video::after { content:"▶"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:38px; color:#fff; text-shadow:0 0 12px #000; }
.media figcaption details summary { font-size:12px; color:var(--muted); cursor:pointer; margin-top:2px; }
.media figcaption .read { font-size:13px; color:var(--muted); white-space:pre-wrap; }
.link { display:block; border:1px solid var(--border); border-radius:10px; padding:8px 10px; margin-top:10px; color:var(--text); font-size:14px; }
.link .dom { color:var(--muted); font-size:12px; }
.link .desc { color:var(--muted); }
.run .card + .card { margin-top:-2px; }
footer.done { text-align:center; color:var(--muted); margin-top:40px; font-size:15px; }
footer.done b { color:var(--text); }
table { border-collapse:collapse; font:13px ui-monospace, monospace; width:100%; }
td, th { border-bottom:1px solid var(--border); padding:4px 6px; text-align:left; vertical-align:top; }
.ok { color:var(--accent); } .bad { color:#f87171; }
</style>
</head>
<body>
<div class="wrap">
<nav class="top"><a class="brand" href="/">herald</a><span><a href="/archive">archive</a><a href="/debug">debug</a></span></nav>
{% block content %}{% endblock %}
</div>
<script>
// Clicking a citation opens the folded sources and highlights the post.
document.addEventListener('click', function (e) {
  var a = e.target.closest('a.cite');
  if (!a) return;
  var el = document.getElementById(a.dataset.sid);
  if (!el) return;
  e.preventDefault();
  var d = el.closest('details'); if (d) d.open = true;
  document.querySelectorAll('.card.target').forEach(function (c) { c.classList.remove('target'); });
  el.classList.add('target');
  el.scrollIntoView({block: 'center'});
  follow(el);
});
// Images above the target can load during the jump and push it out of view;
// keep it centred until they settle or the reader scrolls themselves.
var stopFollowing = function () {};
function follow(el) {
  stopFollowing();
  var want = el.getBoundingClientRect().top;
  function recenter(e) {
    if (e.target.tagName !== 'IMG') return;
    var drift = el.getBoundingClientRect().top - want;
    if (Math.abs(drift) > 4) window.scrollBy(0, drift);
  }
  function stop() {
    document.removeEventListener('load', recenter, true);
    ['wheel', 'touchstart', 'keydown'].forEach(function (t) { window.removeEventListener(t, stop); });
  }
  stopFollowing = stop;
  document.addEventListener('load', recenter, true);
  ['wheel', 'touchstart', 'keydown'].forEach(function (t) { window.addEventListener(t, stop, {once: true}); });
  setTimeout(stop, 4000);
}
</script>
</body>
</html>
